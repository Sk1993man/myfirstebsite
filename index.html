<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My professional portfolio</title>
    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <img src="sks.jpg" alt="sks.jpg" class="profile-img">

        <h1>Saurabh kumar</h1>
        <p class="subtitle">(Web Developer)</p>
        <hr>
        <p>I learn coding and this is my first professional webpage</p>

        <!-- मेरी स्किल्स सेक्शन -->
        <div class="skills-container">
            <h3>मेरी स्किल्स</h3>
            <div class="skills">
                <span class="skill-badge">HTML5</span>
                <span class="skill-badge">CSS3</span>
                <span class="skill-badge">JavaScript</span>
                <span class="skill-badge">VS Code</span>
            </div>
        </div>

        <button id="themeBtn" class="btn">थीम बदलें (Dark/Light)</button>
        <button id="colorBtn" class="btn btn-secondary">बैकग्राउंड बदलें</button>

        <a href="https://github.com" target="_blank" class="btn">मेरा गिटहब प्रोफाइल</a>
        
        <hr>
        
        <!-- मुझसे संपर्क करें सेक्शन -->
        <div class="contact-section">
            <h3>मुझसे संपर्क करें</h3>
            
            <!-- यहाँ हमने बिल्कुल सही और चालू API लिंक डाल दिया है -->
            <form action="https://web3forms.com" method="POST">

                <!-- आपकी असली चाबी बिल्कुल सही जगह पर सेट है -->
                <input type="hidden" name="access_key" value="2d80f3b4-bc21-4677-a148-b9cb5000d589">

                <input type="text" name="name" placeholder="आपका नाम" required class="form-input">
                <input type="email" name="email" placeholder="आपकी ईमेल आईडी" required class="form-input">
                <textarea name="message" placeholder="आपका संदेश यहाँ लिखें..." required class="form-input" rows="3"></textarea>
                
                <button type="submit" class="btn btn-submit">संदेश भेजें</button>
            </form>
        </div>

    </div>

    <!-- JavaScript file link -->
    <script src="script.js"></script>
</body>
</html>
